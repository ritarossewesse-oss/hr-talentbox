<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>智活人才库 · HR人才库智能管理与激活平台</title>
<style>
:root{
  --bg:#f5f4f1;--sf:#ffffff;--sf2:#fbfaf8;
  --ink:#191a1c;--mut:#70747c;--faint:#9a9ea6;
  --line:#e7e5e0;--line2:#f0efeb;
  --acc:#0f766e;--acc2:#0b5a54;--accbg:#e7f3f0;--accline:#bfe0da;
  --gold:#96660a;--goldbg:#fbf0d3;--goldline:#ecd9a0;
  --red:#b42318;--redbg:#fdecea;
  --blue:#175cd3;--bluebg:#eaf1fd;
  --vio:#6941c6;--viobg:#f2edfb;
  --grn:#067647;--grnbg:#e7f4ec;
  --sh:0 1px 2px rgba(22,22,28,.04),0 10px 28px rgba(22,22,28,.07);
  --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;height:100vh;overflow:hidden}
/* ---------- sidebar ---------- */
.sidebar{width:220px;flex:none;background:var(--sf);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line2)}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 4px 10px rgba(15,118,110,.28)}
.brand .bt{display:flex;align-items:center;gap:10px}
.brand .nm{font-weight:700;font-size:15.5px;letter-spacing:.5px}
.brand .sub{font-size:11px;color:var(--mut);margin-top:1px;letter-spacing:.3px}
.nav{flex:1;padding:12px 10px;overflow:auto}
.nav .cap{font-size:11px;color:var(--faint);padding:10px 10px 6px;letter-spacing:1px}
.nitem{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:0;background:none;border-radius:9px;color:#3d4046;font-size:13.5px;margin-bottom:2px;text-align:left;transition:background .15s}
.nitem:hover{background:var(--line2)}
.nitem.on{background:var(--accbg);color:var(--acc2);font-weight:600}
.nitem svg{width:17px;height:17px;flex:none;opacity:.85}
.nitem .nbdg{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;border-radius:8px;padding:0 6px;line-height:16px;min-width:16px;text-align:center}
.nitem .nbdg.soft{background:var(--goldbg);color:var(--gold)}
.sidefoot{padding:14px 16px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--mut)}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#12b76a;margin-right:6px;animation:pulse 2s infinite}
.syncdot.warn{background:#f79009;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,183,106,.4)}70%{box-shadow:0 0 0 6px rgba(18,183,106,0)}100%{box-shadow:0 0 0 0 rgba(18,183,106,0)}}
/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;flex:none;background:var(--sf);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px}
.ttl{font-size:16px;font-weight:700}
.ttl small{display:block;font-size:11.5px;font-weight:400;color:var(--mut);margin-top:-1px}
.tspace{flex:1}
.iconbtn{position:relative;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--sf);display:flex;align-items:center;justify-content:center;color:#4a4e55}
.iconbtn:hover{background:var(--line2)}
.iconbtn svg{width:17px;height:17px}
.bdg{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;min-width:16px;line-height:16px;border-radius:8px;padding:0 4px;text-align:center}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#134e4a,#0f766e);color:#fff;font-size:12.5px;display:flex;align-items:center;justify-content:center;font-weight:600}
.viewwrap{flex:1;overflow:auto;padding:22px 24px 40px}
.view{max-width:1180px;margin:0 auto;animation:vin .3s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- generic ---------- */
.panel{background:var(--sf);border:1px solid var(--line);border-radius:var(--r)}
.ph{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.ph .t{font-weight:700;font-size:14px}
.ph .d{font-size:12px;color:var(--mut)}
.ph .sp{flex:1}
.pb{padding:16px 18px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;border:1px solid var(--line);background:var(--sf);padding:7px 14px;font-size:13px;color:var(--ink);transition:.15s}
.btn:hover{border-color:#d5d2cb;background:var(--sf2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--acc2)}
.btn.pri:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--acc2)}
.btn.ghost:hover{background:var(--accbg)}
.btn.danger{color:var(--red);border-color:#f3c6c2}
.btn.danger:hover{background:var(--redbg)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--sf2);color:#4a4e55;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%}
.chip.acc{background:var(--accbg);color:var(--acc2);border-color:var(--accline)}
.chip.gold{background:var(--goldbg);color:var(--gold);border-color:var(--goldline)}
.chip.red{background:var(--redbg);color:var(--red);border-color:#f3c6c2}
.chip.blue{background:var(--bluebg);color:var(--blue);border-color:#c8dbf7}
.chip.grn{background:var(--grnbg);color:var(--grn);border-color:#bfe3cd}
.chip.vio{background:var(--viobg);color:var(--vio);border-color:#ded0f5}
.chip.gray{background:#f2f1ee;color:#6b6f76}
.chip.click{cursor:pointer;user-select:none}
.chip.click:hover{border-color:#c9c6bf}
.chip.on{background:var(--accbg);color:var(--acc2);border-color:var(--accline);font-weight:600}
.chip.off{opacity:.5;text-decoration:line-through}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:1.5px 8px;border-radius:6px;background:var(--line2);color:#5a5e66;margin-right:4px;white-space:nowrap}
.tag.hit{background:var(--accbg);color:var(--acc2);font-weight:600}
.tag.add{background:var(--grnbg);color:var(--grn)}
.tag.del{background:var(--redbg);color:var(--red);text-decoration:line-through}
.scene-校招{color:#0e7490}.scene-社招{color:#0f766e}.scene-实习{color:#b45309}
.d-校招{background:#0e7490}.d-社招{background:#0f766e}.d-实习{background:#b45309}
.hp-高潜{background:var(--goldbg);color:var(--gold);border:1px solid var(--goldline)}
.hp-优质{background:var(--accbg);color:var(--acc2);border:1px solid var(--accline)}
.hp-普通{background:#f2f1ee;color:#8a8e96;border:1px solid var(--line)}
.src-过往筛除{background:var(--redbg);color:var(--red)}
.src-往期面试{background:var(--bluebg);color:var(--blue)}
.src-储备人才{background:var(--grnbg);color:var(--grn)}
.src-新投递{background:var(--viobg);color:var(--vio)}
/* stats strip */
.strip{display:flex;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{flex:1;padding:18px 20px;position:relative}
.stat+.stat{border-left:1px solid var(--line2)}
.stat .k{font-size:12px;color:var(--mut)}
.stat .v{font-size:26px;font-weight:700;margin-top:2px;letter-spacing:-.5px}
.stat .v small{font-size:12px;color:var(--mut);font-weight:400;margin-left:4px}
.stat .s{font-size:11.5px;color:var(--faint);margin-top:2px}
.stat .ico{position:absolute;right:16px;top:16px;color:#c9c6bf}
.stat .ico svg{width:18px;height:18px}
/* alerts */
.alerts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.abtn{font-size:12px;color:var(--acc2);background:none;border:0;font-weight:600;white-space:nowrap}
.abtn:hover{text-decoration:underline}
.alist .arow{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line2)}
.alist .arow:first-child{border-top:0}
.arow .tx{flex:1;min-width:0}
.arow .tx .l1{font-size:13px;font-weight:600}
.arow .tx .l2{font-size:11.5px;color:var(--mut)}
/* rows list */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line2);cursor:pointer;transition:background .12s;position:relative}
.row:first-child{border-top:0}
.row:hover{background:#f8f7f4}
.row .avt{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:#fff}
.row .mi{flex:1;min-width:0}
.row .l1{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px}
.row .l1 .nm{white-space:nowrap}
.row .l2{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .rt{flex:none;text-align:right}
.ring{width:36px;height:36px}
.ring-bg{fill:none;stroke:var(--line2);stroke-width:4}
.ring-fg{fill:none;stroke:var(--acc);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring-t{font-size:10.5px;font-weight:700;fill:var(--ink)}
.ring.low .ring-fg{stroke:#f79009}
.rank{font-size:10.5px;font-weight:700;color:var(--gold);background:var(--goldbg);border:1px solid var(--goldline);border-radius:6px;padding:0 5px;line-height:16px}
.his{border-top:1px dashed var(--line);background:var(--sf2);padding:10px 18px 12px 64px;margin-top:-1px}
.his .hl{font-size:12px;color:var(--mut);padding:2px 0;display:flex;gap:10px}
.his .hl b{color:#4a4e55;font-weight:600;min-width:76px}
/* matching */
.mgrid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.jrow{padding:11px 14px;border-top:1px solid var(--line2);cursor:pointer;transition:background .12s}
.jrow:first-child{border-top:0}
.jrow:hover{background:#f8f7f4}
.jrow.on{background:var(--accbg);box-shadow:inset 3px 0 0 var(--acc)}
.jrow .l1{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.jrow .l2{font-size:11.5px;color:var(--mut);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.wctl{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wctl label{width:88px;font-size:12.5px;color:#4a4e55;flex:none}
.wctl input[type=range]{flex:1;accent-color:var(--acc);height:4px}
.wctl .wv{width:34px;text-align:right;font-weight:700;font-size:12.5px;color:var(--acc2)}
.engine{background:var(--sf2);border:1px dashed #d5d2cb;border-radius:10px;padding:14px 16px;margin-top:14px}
.estep{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px;color:var(--mut)}
.estep .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--faint)}
.estep.act{color:var(--ink);font-weight:600}
.estep.act .st{border-color:var(--acc);color:var(--acc);animation:spin 1s linear infinite}
.estep.done{color:#4a4e55}
.estep.done .st{background:var(--acc);border-color:var(--acc);color:#fff;animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pbar{height:5px;border-radius:3px;background:var(--line2);overflow:hidden;margin:10px 0 2px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#14b8a6);border-radius:3px;transition:width .5s ease;width:0}
.grp-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:700;font-size:13px}
.grp-h .n{font-size:11px;color:var(--mut);font-weight:400}
/* review */
.duecard{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--line2);cursor:pointer}
.duecard:hover{background:#f8f7f4}
.duecard.on{background:var(--accbg);box-shadow:inset 3px 0 0 var(--acc)}
.funnel{display:flex;align-items:stretch;gap:0;background:var(--sf2);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.fseg{flex:1;padding:12px 16px;position:relative}
.fseg+.fseg{border-left:1px solid var(--line2)}
.fseg .k{font-size:11.5px;color:var(--mut)}
.fseg .v{font-size:21px;font-weight:700}
.fseg .r{font-size:11px;margin-top:1px}
.r.up{color:var(--grn)}.r.down{color:var(--red)}.r.flat{color:var(--mut)}
.bar{margin-bottom:10px}
.bar .bl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bar .bl b{font-weight:600}
.bar .tr{height:8px;background:var(--line2);border-radius:4px;position:relative}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:4px}
.bar .tr em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold);border-radius:1px}
.bar .bl .mk{color:var(--gold);font-size:11px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.timeline{position:relative;padding-left:20px;margin-top:6px}
.timeline:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tli{position:relative;padding:4px 0 10px;font-size:12.5px}
.tli:before{content:"";position:absolute;left:-19px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--sf);border:2.5px solid var(--acc)}
.tli .td{color:var(--faint);font-size:11px;margin-right:8px}
.diffbox{border:1px solid var(--line2);background:var(--sf2);border-radius:10px;padding:12px 14px}
.diffbox .cap{font-size:11.5px;color:var(--mut);margin-bottom:6px}
/* pool */
.poolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.poolc{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.poolc .pn{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.poolc .pv{font-size:30px;font-weight:700;letter-spacing:-1px;margin-top:6px}
.poolc .pv small{font-size:12px;font-weight:400;color:var(--mut);letter-spacing:0}
.poolc .pd{font-size:11.5px;color:var(--mut);margin-top:2px}
.poolc .glyph{position:absolute;right:-6px;bottom:-14px;font-size:64px;font-weight:800;color:var(--line2);line-height:1;user-select:none}
.cycle{position:relative;height:2px;background:var(--line);margin:14px 6px 8px}
.cycle .node{position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--sf);border:3px solid var(--acc)}
.cycle .node.future{border-color:var(--gold);background:var(--goldbg)}
.cycle .nl{position:absolute;top:12px;font-size:11px;color:var(--mut);white-space:nowrap;transform:translateX(-50%)}
.migrate-flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--goldbg)}100%{background:transparent}}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srch{flex:1;max-width:260px;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;background:var(--sf);outline:none}
.srch:focus{border-color:var(--acc)}
/* bio card */
#bioCard{position:fixed;z-index:90;width:372px;background:var(--sf);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(20,20,30,.16);padding:16px 18px;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .18s,transform .18s}
#bioCard.show{opacity:1;pointer-events:auto;transform:none}
#bioCard .bh{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
#bioCard .bname{font-size:15px;font-weight:700}
#bioCard .bsub{font-size:11.5px;color:var(--mut)}
.bsec{margin-top:10px}
.bsec .bc{font-size:10.5px;color:var(--faint);letter-spacing:1px;margin-bottom:4px}
.bsec .bv{font-size:12.5px;color:#33363c}
.bquote{background:var(--sf2);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:7px 10px;font-size:12px;color:#4a4e55}
.bfoot{margin-top:12px;padding-top:9px;border-top:1px dashed var(--line);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;align-items:center}
/* modal */
#modalRoot{position:fixed;inset:0;z-index:100;display:none}
#modalRoot.show{display:block}
.overlay{position:absolute;inset:0;background:rgba(24,26,30,.4);backdrop-filter:blur(2px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:600px;max-width:94vw;max-height:86vh;overflow:auto;background:var(--sf);border-radius:16px;box-shadow:0 24px 70px rgba(10,12,16,.3);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}}
.mh{padding:16px 22px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--sf);z-index:2}
.mh .t{font-weight:700;font-size:15px}
.mh .sp{flex:1}
.mx{border:0;background:none;width:28px;height:28px;border-radius:8px;color:var(--mut);font-size:16px}
.mx:hover{background:var(--line2)}
.mb{padding:18px 22px 22px}
.msec{margin-bottom:16px}
.msec .cap{font-size:11px;color:var(--faint);letter-spacing:1px;margin-bottom:7px;font-weight:700}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13px}
.kv .k{color:var(--mut)}
.evrow{padding:9px 0;border-top:1px dashed var(--line2);font-size:12.5px}
.evrow:first-of-type{border-top:0}
.evrow .eq{color:#33363c;margin:2px 0}
.evrow .em{font-size:11px;color:var(--faint)}
/* toast */
#toastRoot{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1d1f23;color:#f4f4f2;font-size:13px;padding:10px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;animation:tin .25s ease}
.toast .tdot{width:7px;height:7px;border-radius:50%;background:#12b76a}
.toast.warn .tdot{background:#f79009}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
/* bell panel */
#bellPanel{position:absolute;top:52px;right:20px;width:360px;background:var(--sf);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);z-index:80;display:none;overflow:hidden}
#bellPanel.show{display:block;animation:pop2 .18s ease}
@keyframes pop2{from{opacity:0;transform:translateY(-6px)}}
.note{font-size:12px;color:var(--mut);background:var(--sf2);border:1px dashed #d9d6cf;border-radius:9px;padding:8px 12px}
.empty{padding:28px;text-align:center;color:var(--faint);font-size:12.5px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d9d6cf;border-radius:5px;border:2px solid var(--bg)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="bt"><div class="mark">智</div>
        <div><div class="nm">智活人才库</div><div class="sub">TalentPulse · 智能管理与激活</div></div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <div><span class="syncdot"></span>已对接原HR招聘系统 · 同步正常</div>
      <div style="margin-top:4px;color:var(--faint)">独立模块部署 · 无缝读写岗位/简历/面试数据</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="ttl" id="pageTitle">工作台</div>

  req.forEach(k=>{if(c.skills.includes(k)){s+=w.skill/req.length;hit.push(k)}});
  const[lo,hi]=jd.yearsRange;
  if(c.years>=lo&&c.years<=hi)s+=w.years;else if(c.years>=Math.max(0,lo-1)&&lo>0)s+=w.years*.6;else s+=w.years*.25;
  s+=jd.eduText.includes('在校')?(c.eduTier>=2?w.edu:w.edu*.4):(c.eduTier>=3?w.edu:c.eduTier>=2?w.edu*.8:w.edu*.3);
  s+=jd.industry?(c.industries.includes(jd.industry)?w.industry:w.industry*.3):w.industry*.7;
  let prefHit=0;
  jd.custom.forEach(p=>{if(p.on&&p.keys.some(k=>c.skills.includes(k)||c.flags.includes(k)||(c.campus&&JSON.stringify(c.campus).includes(k)))){s+=p.weight;prefHit++}});
  const fails=jd.threshold.filter(t=>!t.ok(c)).map(t=>t.label);
  return{score:Math.min(98,Math.round(s)),hit,fails,prefHit};
}
async function runMatch(jobId){
  const job=byId(jobs,jobId);if(!job)return;
  const btn=$('#runMatchBtn');if(btn){btn.disabled=true;btn.textContent='AI匹配引擎运行中…'}
  const panel=$('#enginePanel');if(panel)panel.style.display='block';
  const steps=[['解析JD核心要求：技能 / 年限 / 学历 / 行业 / 硬性门槛','0'],['场景路由：本次扫描「'+POOL[job.scene]+'」','14'],['扫描存量简历 1,286 份（含往届迁移校招人才）','34'],['多维权重打分 + 个性化偏好加权','62'],['过滤硬性门槛不达标项','81'],['生成 TOP20 待查看匹配清单','100']];
  for(let i=0;i<steps.length;i++){
    const rows=$('#engineSteps');if(!rows)return;
    rows.innerHTML=steps.map((st,j)=>'<div class="estep '+(j<i?'done':j===i?'act':'')+'"><span class="st">'+(j<i?'✓':j+1)+'</span><span>'+esc(st[0])+'</span></div>').join('');
    const bar=$('#engineBar');if(bar)bar.style.width=steps[i][1]+'%';
    await sleep(i===2?900:620);
  }
  await sleep(400);
  const poolCands=candidates.filter(c=>c.scene===job.scene&&c.source!=='新投递'&&!(c.appliedJob===job.id));
  let filtered=0;const scored=[];
  poolCands.forEach(c=>{const r=scoreOne(job,c);if(r.fails.length){filtered++;return}scored.push(Object.assign({c},r))});
  scored.sort((a,b)=>b.score-a.score);
  const list=scored.slice(0,20);
  const fresh=candidates.filter(c=>c.source==='新投递'&&c.appliedJob===job.id).map(c=>Object.assign({c},scoreOne(job,c))).sort((a,b)=>b.score-a.score);
  job.matchResults={ts:new Date().toISOString(),list,fresh,filtered,scanned:1286};
  toast('匹配完成：命中存量候选人 '+scored.length+' 份，TOP20 已归入待查看清单');
  S.jobId=jobId;render();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!e.target.closest('#bellPanel')&&!e.target.closest('[data-action="bell"]')){const bp=$('#bellPanel');if(bp)bp.classList.remove('show')}
  if(!t)return;
  const a=t.dataset.action,id=t.dataset.id;
  if(a!=='his'&&a!=='openCand')hideBio();
  switch(a){
    case 'nav':S.view=id;S.reviewJob=null;render();break;
    case 'openJob':S.view='match';S.jobId=id;render();break;
    case 'runMatch':runMatch(id);break;
    case 'togglePref':{const j=byId(jobs,S.jobId);if(j){j.jd.custom[+t.dataset.i].on=!j.jd.custom[+t.dataset.i].on;render()}break}
    case 'his':{const his=t.closest('.row').nextElementSibling;if(his&&his.classList.contains('his')){his.style.display=his.style.display==='none'?'block':'none'}e.stopPropagation();break}
    case 'openCand':{const c=byId(candidates,id);if(c){hideBio();openModal(candDetail(c))}break}
    case 'closeModal':closeModal();break;
    case 'goReview':S.view='review';S.reviewJob=id;render();break;
    case 'openReview':S.reviewJob=id;render();break;
    case 'backReview':S.reviewJob=null;render();break;
    case 'adoptTags':{const j=byId(jobs,id);if(j){j.originalTags=j.review.suggested.slice();j.iterations.push({date:todayStr(),type:'AI优化',note:'采纳AI复盘建议，自动更新岗位核心需求标签',tags:j.originalTags.slice()});toast('已采纳AI画像优化，迭代记录已留存');render()}break}
    case 'editTags':{const j=byId(jobs,id);if(j)openTagEditor(j);break}
    case 'goHp':S.view='hp';S.hpTab=id&&candidates.some(c=>c.id===id)?byId(candidates,id).scene:'all';render();break;
    case 'hpTab':S.hpTab=id;render();break;
    case 'poolTab':S.poolTab=id;render();break;
    case 'touchHp':{const c=byId(candidates,id);if(c){c.lastTouch=todayStr();c.history.push([todayStr(),c.adapt[0]||c.title||'保温','HR保温回访']);toast('已记录对 '+c.name+' 的保温回访');render()}break}
    case 'editBio':{const c=byId(candidates,id);if(c)openBioEditor(c);break}
    case 'saveBio':{const c=byId(candidates,t.dataset.id);if(c){c.bioExtra=$('#bioText').value.trim();toast('小传备注已更新');closeModal();render()}break}
    case 'bell':toggleBell();break;
    case 'newJd':toast('演示环境：请在左侧选择岗位编辑触发，或理解为已上传新JD并自动触发匹配',true);break;
    case 'migrateDemo':doMigrate();break;
    case 'restoreDemo':doRestore();break;
  }
});

  const due=dueJobs(),od=overdueHp();
  p.innerHTML='<div style="padding:12px 16px;border-bottom:1px solid var(--line2);font-weight:700;font-size:13px">提醒中心</div>'+
  (due.length?due.map(j=>'<div class="arow" style="display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line2);cursor:pointer" data-action="goReview" data-id="'+j.id+'"><span class="chip gold">复盘</span><div style="flex:1"><div style="font-size:12.5px;font-weight:600">'+esc(j.title)+'</div><div style="font-size:11px;color:var(--mut)">已发布 '+j.postedDays+' 天，自动复盘已生成</div></div></div>').join(''):'')+
  (od.length?od.slice(0,6).map(c=>{const o=hpOverdue(c);return '<div class="arow" style="display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line2);cursor:pointer" data-action="goHp" data-id="'+c.id+'"><span class="chip"><span class="dot d-'+SCENE[c.scene]+'"></span>'+SCENE[c.scene]+'</span><div style="flex:1"><div style="font-size:12.5px;font-weight:600">'+esc(c.name)+' · '+c.hp+'候选</div><div style="font-size:11px;color:var(--mut)">超保温周期 '+(o.days-o.interval)+' 天，建议回访</div></div></div>'}).join(''):'')+
  (!due.length&&!od.length?'<div class="empty">暂无待处理提醒</div>':'');
  p.classList.add('show');
}
/* migrate */
function doMigrate(){
  const campus=candidates.filter(c=>c.scene==='campus');
  if(!campus.length){toast('校招人才库已迁移完毕',true);return}
  if(!SNAP)SNAP=JSON.stringify(candidates);
  campus.forEach(c=>{c.scene='society';c.pool='社招人才库';c.migrateFrom='2027届校招人才库';if(c.hp!=='普通')c.hpScene='社招高潜';c.history.push([todayStr(),'校招周期自动闭环','2027届周期结束，批量自动迁入社招人才库'])});
  const rb=$('#restoreBtn');if(rb)rb.style.display='';
  toast('校招周期闭环：'+campus.length+' 名候选人已自动迁入社招人才库，标签与归属已同步更新');
  render();
  setTimeout(()=>{document.querySelectorAll('.poolc')[1]&&document.querySelectorAll('.poolc')[1].classList.add('migrate-flash')},60);
}
function doRestore(){
  if(!SNAP)return;
  const restored=JSON.parse(SNAP);restored.forEach((c,i)=>Object.assign(candidates[i],c));
  SNAP=null;toast('已恢复演示数据');render();
}
/* ================= boot ================= */
function render(){renderNav();const v={workbench:vWorkbench,match:vMatch,review:vReview,hp:vHp,pool:vPool}[S.view];$('#viewRoot').innerHTML=v();window.scrollTo(0,0)}
render();
</script>
</body>
